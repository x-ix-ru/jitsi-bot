[package]
name = "hermes-jitsi-bridge"
version = "0.1.0"
edition = "2021"
description = "Headless Jitsi recorder with a session API"
license = "MIT"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.11", features = ["fs"] }
uuid = { version = "1.28", features = ["v4", "serde"] }
